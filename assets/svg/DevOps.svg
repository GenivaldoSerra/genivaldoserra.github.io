<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 400 400">
  <style>
    .float { animation: float 2.6s ease-in-out infinite; transform-origin: center; }
    .pulse { animation: pulse 1.8s ease-in-out infinite; transform-origin: center; }
    .spin { animation: spin 8s linear infinite; transform-origin: center; }
    .line-pulse { animation: linePulse 1.3s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.03); opacity: 0.95; } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes linePulse { 0%, 100% { stroke-opacity: 1; } 50% { stroke-opacity: 0.7; } }
  </style>
